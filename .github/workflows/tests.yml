name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[catalog,benchmark,structure,fragment]"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Compile package
        run: python -m compileall -q src
